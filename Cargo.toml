[package]
name = "right_editor"
version = "0.2.1"
edition = "2024"
description = "A low-latency Neovim GUI for Windows that runs Neovim inside WSL"
license = "MIT"
repository = "https://github.com/johnright/right_editor"

[features]
# Build with the "windows" subsystem (no console). By default the
# console is used, so logs and output reach the WSL terminal the exe is launched from.
gui-subsystem = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4.35"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
pollster = "1.0.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
resvg = { version = "0.47.0", default-features = false, features = ["text"] }
rmpv = "1.3.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros"] }
toml = "0.9"
wgpu = "30.0.1"
winit = "0.30.13"

# Dependencies (wgpu, naga, ...) are very slow in debug: we optimize them
# in the dev profile too, our crate stays compiled in debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
